name: Documentation

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/docs.yml"
      - "dataviz/**"
      - "docs/**"
      - "pyproject.toml"
      - "requirements*.txt"
  pull_request:
    paths:
      - ".github/workflows/docs.yml"
      - "dataviz/**"
      - "docs/**"
      - "pyproject.toml"
      - "requirements*.txt"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      MPLBACKEND: Agg
      MPLCONFIGDIR: /tmp/matplotlib

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and documentation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[docs,export]"

      - name: Render API example images
        run: python docs/_tools/generate_api_images.py

      - name: Generate API member pages
        run: python docs/generate_api.py

      - name: Verify every Complete example is runnable
        run: python docs/generate_api.py --verify

      - name: Commit regenerated API pages
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if git diff --quiet -- docs/source/api; then
            echo "API pages already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/source/api
          git commit -m "docs(api): regenerate member pages"
          git push

      - name: Check generated API pages are current (forked pull requests)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          git diff --exit-code -- docs/source/api || {
            echo "::error::API pages are stale. Run 'python docs/generate_api.py' and commit the result."
            exit 1
          }

      - name: Lint generated docs for redundant 'package' wording
        run: python docs/_tools/check_package_wording.py

      - name: Build documentation with warnings as errors
        run: >-
          python -m sphinx
          -W --keep-going
          -b html
          docs/source
          docs/build/html

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/build/html

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
